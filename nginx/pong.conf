# OPTIONAL: nginx in front of the app on a VM (e.g. for TLS / port 80).
# The app runs fine without it: scripts/start.sh serves HTTP, WebSockets and
# static files on port 8000 by itself.
#
# To use it:
#   1. Replace /path/to/pong-game below with the real project path.
#   2. Copy this file to /etc/nginx/conf.d/pong.conf (or sites-enabled/) and reload nginx.
#   3. In .env set BIND_ADDRESS=127.0.0.1, SERVE_STATIC=false and SERVE_MEDIA=false, then add the
#      public hostname to ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS and SITE_URL.
#      If nginx terminates HTTPS, also set SECURE_COOKIES=true.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream pong_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;

    location /static/ {
        alias /path/to/pong-game/transcendence/static/;
    }

    # Uploaded avatars (MEDIA_ROOT, default data/media/).
    location /media/ {
        alias /path/to/pong-game/data/media/;
        add_header X-Content-Type-Options nosniff;
    }

    client_max_body_size 6m;  # avatar uploads are limited to 5 MB

    # Plain HTTP and WebSockets (/ws/...) go to the same Daphne process.
    location / {
        proxy_pass http://pong_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
